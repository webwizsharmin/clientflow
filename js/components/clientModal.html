<!-- Client Modal Overlay -->
<div
  id="clientModal"
  class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 backdrop-blur-sm p-4"
  role="dialog"
  aria-modal="true"
  aria-labelledby="clientModalTitle"
>
  <!-- Modal Container -->
  <div
    class="w-full max-w-2xl rounded-2xl bg-white shadow-2xl overflow-hidden animate-fadeIn"
  >
    <!-- Modal Header -->
    <div
      class="flex items-center justify-between border-b border-slate-200 px-6 py-4"
    >
      <div>
        <h2 id="clientModalTitle" class="text-xl font-bold text-slate-800">
          Add Client
        </h2>
        <p class="mt-1 text-sm text-slate-500">
          Fill in the details to register a new client.
        </p>
      </div>

      <!-- Close Button -->
      <button
        type="button"
        id="closeClientModal"
        aria-label="Close modal"
        class="flex h-9 w-9 items-center justify-center rounded-full text-slate-500 transition hover:bg-slate-100 hover:text-slate-700"
      >
        <i class="bx bx-x text-xl"></i>
      </button>
    </div>

    <!-- Modal Body -->
    <form id="clientForm" class="p-6 space-y-6">
      <!-- Grid -->
      <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
        <!-- Full Name -->
        <div>
          <label for="clientName" class="form-label">Full Name</label>
          <input
            type="text"
            id="clientName"
            name="clientName"
            placeholder="Jane Doe"
            class="form-input"
            required
          />
        </div>

        <!-- Email -->
        <div>
          <label for="clientEmail" class="form-label">Email</label>
          <input
            type="email"
            id="clientEmail"
            name="clientEmail"
            placeholder="jane@company.com"
            class="form-input"
            required
          />
        </div>

        <!-- Phone -->
        <div>
          <label for="clientPhone" class="form-label">Phone</label>
          <input
            type="tel"
            id="clientPhone"
            name="clientPhone"
            placeholder="+880 1234-567890"
            class="form-input"
          />
        </div>

        <!-- Company -->
        <div>
          <label for="clientCompany" class="form-label">Company</label>
          <input
            type="text"
            id="clientCompany"
            name="clientCompany"
            placeholder="Acme Corp"
            class="form-input"
          />
        </div>
      </div>

      <!-- Address -->
      <div>
        <label for="clientAddress" class="form-label">Address</label>
        <textarea
          id="clientAddress"
          name="clientAddress"
          rows="3"
          placeholder="Street, City, Country"
          class="form-input resize-none"
        ></textarea>
      </div>

      <!-- Notes -->
      <div>
        <label for="clientNotes" class="form-label">Notes</label>
        <textarea
          id="clientNotes"
          name="clientNotes"
          rows="3"
          placeholder="Any additional details..."
          class="form-input resize-none"
        ></textarea>
      </div>

      <!-- Footer Buttons -->
      <div
        class="flex flex-col-reverse gap-3 border-t border-slate-200 pt-6 sm:flex-row sm:justify-end"
      >
        <button type="button" id="cancelClientModal" class="btn-secondary">
          Cancel
        </button>
        <button type="submit" class="btn-primary">Save Client</button>
      </div>
    </form>
  </div>
</div>

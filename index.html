<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./dist/output.css" />
    <title>Clientflow</title>
  </head>
  <body class="flex h-screen bg-slate-50 font-poppins overflow-x-hidden">
    <!-- Sidebar -->
    <aside
      class="w-16 lg:w-64 bg-white shadow-md flex flex-col justify-between"
    >
      <nav>
        <ul>
          <li>
            <a href="#home" class="sidebar-link flex items-center space-x-2">
              <i class="bx bxs-dashboard text-xl"></i
              ><span class="hidden lg:inline">Dashboard</span>
            </a>
          </li>
          <li>
            <a href="#clients" class="sidebar-link flex items-center space-x-2">
              <i class="bx bxs-user text-xl"></i>
              <span class="hidden lg:inline">Clients</span>
            </a>
          </li>
          <li>
            <a href="#leads" class="sidebar-link flex items-center space-x-2">
              <i class="bx bxs-user-detail text-xl"></i>
              <span class="hidden lg:inline">Leads</span>
            </a>
          </li>
          <li>
            <a
              href="#invoices"
              class="sidebar-link flex items-center space-x-2"
            >
              <i class="bx bxs-spreadsheet text-xl"></i>
              <span class="hidden lg:inline">Invoices</span>
            </a>
          </li>
          <li>
            <a href="#tasks" class="sidebar-link flex items-center space-x-2">
              <i class="bx bx-task-x text-xl"></i>
              <span class="hidden lg:inline">Tasks</span>
            </a>
          </li>
          <li>
            <a href="#setting" class="sidebar-link flex items-center space-x-2">
              <i class="bx bxs-cog text-xl"></i>
              <span class="hidden lg:inline">Setting</span>
            </a>
          </li>
          <li>
            <a href="#help" class="sidebar-link flex items-center space-x-2">
              <i class="bx bxs-help-circle text-xl"></i>
              <span class="hidden lg:inline">Help & Support</span>
            </a>
          </li>
        </ul>
      </nav>
      <div class="user-profile flex items-center space-x-2 p-2">
        <i class="bx bx-user-circle text-2xl"></i>
        <div class="hidden lg:block">
          <p class="text-sm font-semibold">John Doe</p>
          <p class="text-xs text-slate-500">admin</p>
        </div>
        <a href="#logout" class="sidebar-link">
          <i class="bx bx-log-out text-xl"></i>
        </a>
      </div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Topbar -->
      <header
        class="h-16 bg-white shadow px-4 flex items-center justify-between gap-4"
      >
        <!-- Search bar -->
        <form role="search" class="search-bar">
          <i class="bx bx-search text-slate-500 mr-2"></i>
          <input
            type="search"
            aria-label="Search Site Content"
            placeholder="search . . ."
            class="flex-1 border-none focus:ring-0"
          />
        </form>

        <!-- Primary Action -->
        <button
          id="newClientBtn"
          type="button"
          class="btn-primary text-sm px-4 py-2 whitespace-nowrap"
        >
          + New Client
        </button>

        <!-- Control -->
        <nav aria-label="User controls" class="flex items-center gap-3">
          <button tupe="button" aria-label="Notifications" class="icon-btn">
            <i class="bx bx-bell text-xl"></i>
          </button>
          <button tupe="button" aria-label="Toggle theme" class="icon-btn">
            <i class="bx bx-sun text-xl"></i>
          </button>

          <div class="flex items-center gap-2">
            <i class="bx bx-user-circle text-2xl"></i>
            <div class="hidden md:block">
              <p class="text-sm font-semibold">John Doe</p>
              <p class="text-xs text-slate-500">admin</p>
            </div>
          </div>
        </nav>
      </header>

      <!-- Main Content -->
      <main id="content" class="flex-1 p-6 overflow-y-auto bg-slate-50"></main>
    </div>

    <!-- Client Modal Overlay -->
    <div
      id="clientModal"
      class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 backdrop-blur-sm p-4"
      role="dialog"
      aria-modal="true"
      aria-labelledby="clientModalTitle"
    >
      <!-- Modal Container -->
      <div
        class="w-full sm:w-3/4 md:w-1/2 max-w-lg rounded-2xl bg-white shadow-2xl max-h-[90vh] flex flex-col animate-fadeIn"
      >
        <!-- Modal Header -->
        <div
          class="flex items-center justify-between border-b border-slate-200 px-6 py-4"
        >
          <div>
            <h2 id="clientModalTitle" class="text-xl font-bold text-slate-800">
              Add Client
            </h2>
            <p class="mt-1 text-sm text-slate-500">
              Fill in the details to register a new client.
            </p>
          </div>

          <!-- Close Button -->
          <button
            type="button"
            id="closeClientModal"
            aria-label="Close modal"
            class="flex h-9 w-9 items-center justify-center rounded-full text-slate-500 transition hover:bg-slate-100 hover:text-slate-700"
          >
            <i class="bx bx-x text-xl"></i>
          </button>
        </div>

        <!-- Modal Body -->
        <form id="clientForm" class="flex-1 overflow-y-auto p-6 space-y-6">
          <!-- Grid -->
          <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
            <!-- Full Name -->
            <div>
              <label for="clientName" class="form-label">Full Name</label>
              <input
                type="text"
                id="clientName"
                name="clientName"
                placeholder="Jane Doe"
                class="form-input"
                required
              />
            </div>

            <!-- Email -->
            <div>
              <label for="clientEmail" class="form-label">Email</label>
              <input
                type="email"
                id="clientEmail"
                name="clientEmail"
                placeholder="jane@company.com"
                class="form-input"
                required
              />
            </div>

            <!-- Phone -->
            <div>
              <label for="clientPhone" class="form-label">Phone</label>
              <input
                type="tel"
                id="clientPhone"
                name="clientPhone"
                placeholder="+880 1234-567890"
                class="form-input"
              />
            </div>

            <!-- Address -->
            <div>
              <label for="clientAddress" class="form-label">Address</label>
              <input
                type="text"
                id="clientAddress"
                name="clientAddress"
                placeholder="Street, City, Country"
                class="form-input"
              />
            </div>

            <div class="flex flex-cols-1 md:flex-cols-3 gap-4">
              <!-- Status -->
              <div>
                <label for="status" class="form-label">Status</label>
                <select name="status" id="clientStatus">
                  <option value="active">Active</option>
                  <option value="inactive">Inactive</option>
                  <option value="pending">Pending</option>
                </select>
              </div>

              <!-- Last interaction Date -->
              <div>
                <label for="last-interaction-date" class="form-label"
                  >Last Interaction Date</label
                >
                <input
                  type="date"
                  name="last-interaction-date"
                  id="lastInteractionDate"
                />
              </div>

              <!-- Engagement -->
              <div>
                <label for="engagement" class="form-label">Engagement</label>
                <select name="engagement" id="clientEngagement">
                  <option value="high">High</option>
                  <option value="medium">Medium</option>
                  <option value="low">Low</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Footer Buttons -->
          <div
            class="flex flex-col-reverse gap-3 border-t border-slate-200 pt-6 sm:flex-row sm:justify-end"
          >
            <button type="button" id="cancelClientModal" class="btn-secondary">
              Cancel
            </button>
            <button type="submit" id="saveClientModal" class="btn-primary">
              Save Client
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Load Chart.js globally -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
